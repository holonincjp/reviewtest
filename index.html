<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Review Test - フロントエンドテスト用サイト</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">PR Review Test</h1>
            <nav class="nav">
                <a href="#dashboard" class="nav-link active" data-section="dashboard">ダッシュボード</a>
                <a href="#pr-list" class="nav-link" data-section="pr-list">PR一覧</a>
                <a href="#review-form" class="nav-link" data-section="review-form">レビューフォーム</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <!-- ダッシュボードセクション -->
            <section id="dashboard" class="section active">
                <h2>ダッシュボード</h2>
                <div class="dashboard-grid">
                    <div class="card">
                        <h3>レビュー待ち</h3>
                        <div class="number">5</div>
                        <p>件のPRがレビュー待ちです</p>
                    </div>
                    <div class="card">
                        <h3>完了済み</h3>
                        <div class="number">12</div>
                        <p>件のレビューが完了しています</p>
                    </div>
                    <div class="card">
                        <h3>平均時間</h3>
                        <div class="number">2.5</div>
                        <p>時間でレビュー完了</p>
                    </div>
                </div>
            </section>

            <!-- PR一覧セクション -->
            <section id="pr-list" class="section">
                <h2>PR一覧</h2>
                <div class="pr-filters">
                    <select id="status-filter">
                        <option value="all">すべてのステータス</option>
                        <option value="pending">レビュー待ち</option>
                        <option value="approved">承認済み</option>
                        <option value="rejected">却下</option>
                    </select>
                    <input type="text" id="search-input" placeholder="PRタイトルで検索...">
                </div>
                <div class="pr-table">
                    <table>
                        <thead>
                            <tr>
                                <th>PR番号</th>
                                <th>タイトル</th>
                                <th>作成者</th>
                                <th>ステータス</th>
                                <th>作成日</th>
                                <th>アクション</th>
                            </tr>
                        </thead>
                        <tbody id="pr-table-body">
                            <!-- JavaScriptで動的に生成 -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- レビューフォームセクション -->
            <section id="review-form" class="section">
                <h2>レビューフォーム</h2>
                <form id="review-form-element" class="form">
                    <div class="form-group">
                        <label for="pr-id">PR番号</label>
                        <input type="text" id="pr-id" required>
                    </div>
                    <div class="form-group">
                        <label for="reviewer-name">レビュアー名</label>
                        <input type="text" id="reviewer-name" required>
                    </div>
                    <div class="form-group">
                        <label for="review-comment">レビューコメント</label>
                        <textarea id="review-comment" rows="5" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="review-status">レビュー結果</label>
                        <select id="review-status" required>
                            <option value="">選択してください</option>
                            <option value="approved">承認</option>
                            <option value="rejected">却下</option>
                            <option value="needs-changes">修正が必要</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="review-score">評価スコア</label>
                        <div class="rating">
                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">レビューを送信</button>
                </form>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 PR Review Test. フロントエンドテスト用サイト</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
