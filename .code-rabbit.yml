# CodeRabbit Configuration File
# シンプルで確実に動作する設定

# 基本設定
language: "ja"
review_style: "friendly"
auto_approve: false

# レビュー対象ファイル
review:
  languages: ["html", "javascript", "css"]
  diff_only: false
  mode: "standard"
  checks:
    html:
      - "tag-structure"
      - "id-duplicate"
      - "alt-attribute"
      - "typo"
    javascript:
      - "syntax-error"
      - "undefined-variable"
      - "console-log"
      - "runtime-error"
    css:
      - "syntax-error"
      - "unused-selectors"

# 除外設定
exclude:
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - "*.min.js"
  - "*.min.css"

# 通知設定
notifications:
  review_complete: true
  critical_issues: true
