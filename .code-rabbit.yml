# CodeRabbit minimal config for quick reviews (日本語)
language: "ja"
review_style: "quick" # 詳細すぎない、短時間向け
auto_approve: false

# レビュー設定（最小必須チェック）
review:
  language: "ja"
  detail_level: "quick" # comprehensive ではなく quick に
  diff_only: true # PRの差分ファイルのみを対象
  max_files: 20 # 差分ファイルの上限（大規模PRは分割を促す）
  # 最低限の致命チェックに絞る
  checks:
    html:
      - "h1-duplicate" # h1が複数ないか（重要）
      - "tag-structure" # タグ閉じ忘れ / 入れ子誤り
      - "id-duplicate" # 重複ID
      - "alt-attribute" # 画像に alt があるか（装飾は空alt可）
      - "typo" # 誤字脱字（表示テキスト・コメント）
    js:
      - "syntax-error" # 構文エラー
      - "undefined-variable" # 未定義変数の参照
      - "no-var" # var の使用禁止
      - "console-log" # console.log 等デバッグ出力の残存
      - "infinite-loop" # 無限ループや意図しない再帰
      - "runtime-error" # 実行時エラー（別途ブラウザチェックを推奨）

  # 追加の軽微な挙動設定
  comment_style: "constructive"
  suggest_fixes: false # 自動修正提案はオフ（処理軽量化のため）
  check_test_coverage: false # テストカバレッジはオフ（時間増大を避ける）

# 除外（大きなバイナリ等は常に除外）
exclude:
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - "*.min.js"
  - "*.min.css"
  - "package-lock.json"
  - "yarn.lock"

# 通知（最低限）
notifications:
  review_complete: true
  critical_issues: true
  security_issues: false # セキュリティは必要時に別途深堀りする

# カスタムルール（最小限）
custom_rules:
  typo:
    enabled: true
    message: "表示文言・コメントの誤字脱字を確認してください"
  console_log:
    enabled: true
    message: "本番に残すべきではないログ出力がないか確認してください"
  error_handling:
    enabled: true
    message: "主要処理に対して適切なエラーハンドリングがあるか簡易確認"

# 強制言語設定（日本語のまま）
settings:
  force_language: "ja"
  comment_language: "ja"
  report_language: "ja"
  feedback_language: "ja"

# CodeRabbit固有（互換性を保つため残す）
code_rabbit:
  review_language: "ja"
  comment_language: "ja"
  feedback_language: "ja"
  force_japanese: true
