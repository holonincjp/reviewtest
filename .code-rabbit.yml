review:
  diff_only: true # 差分のみ対象
  mode: quick # 短時間レビュー（目安5分）
  language: ja-JP
  checks:
    html:
      - h1-duplicate
      - tag-structure
      - id-duplicate
      - alt-attribute
      - typo
    js:
      - syntax-error
      - undefined-variable
      - no-var
      - console-log
      - infinite-loop
      - runtime-error
  skip:
    - css
    - naming-conventions
    - micro-optimizations
    - style-nits
